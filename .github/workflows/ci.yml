name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and ARM64 for every OS family.
        # macos-15-intel is GitHub's remaining Intel macOS image.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p simple-setup-cli
      - name: Real discovery on this runner (read-only listing)
        shell: bash
        run: |
          target/release/simple-setup scan --json > scan.json
          node scripts/check-scan.mjs scan.json
      - if: runner.os == 'Linux'
        name: Static restore engines (both arches; the native one is run)
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          ./scripts/build-restore-kit.sh
          target/release/restore-kit/linux-$(uname -m)/simple-setup --version

  gui:
    # The real desktop app driven through WebDriver: accessibility audit (axe-core in both
    # themes, keyboard, reflow and zoom) and the acceptance flow (encrypted snapshot, sending,
    # receiving, restoring, updating).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: e2e/run.sh a11y
        env: { TMPDIR: "${{ runner.temp }}" }
      - run: e2e/run.sh acceptance
        env: { TMPDIR: "${{ runner.temp }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/simple-setup-e2e.*/
          if-no-files-found: ignore
