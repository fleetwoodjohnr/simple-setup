name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and ARM64 for every OS family.
        # macos-15-intel is GitHub's remaining Intel macOS image.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p simple-setup-cli
      - name: Real discovery on this runner (read-only listing)
        shell: bash
        run: |
          target/release/simple-setup scan --json > scan.json
          node scripts/check-scan.mjs scan.json
      - if: runner.os == 'Linux'
        name: Static restore engines (both arches; the native one is run)
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          ./scripts/build-restore-kit.sh
          "target/release/restore-kit/linux-$(uname -m)/simple-setup" --version

  gui:
    # The real desktop app driven through WebDriver: accessibility audit (axe-core in both
    # themes, keyboard, reflow and zoom) and the acceptance flow (encrypted snapshot, sending,
    # receiving, restoring, updating).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: e2e/run.sh a11y
        env: { TMPDIR: "${{ runner.temp }}" }
      - run: e2e/run.sh acceptance
        env: { TMPDIR: "${{ runner.temp }}" }
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/simple-setup-e2e.*/
          if-no-files-found: ignore

  migrations:
    # Real installs across distributions in throwaway containers (scripts/test-migrations.sh):
    # Fedora→Mint online and offline, Mint→Fedora, Ubuntu→Arch, Debian→openSUSE, Arch→Fedora,
    # Fedora→Alpine, Fedora→Gentoo (Portage), Fedora→NixOS (Nix) and an unknown distribution
    # with an imported profile; each restored twice.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: cargo build --release -p simple-setup-cli --target x86_64-unknown-linux-musl
        env: { CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld }
      - run: scripts/test-migrations.sh
        env: { TMPDIR: "${{ runner.temp }}" }

  engines-emulated:
    # Restore programs for 32-bit x86, 32-bit ARM and RISC-V: built statically, then the core
    # unit tests and the program itself run under QEMU user emulation (emulated, not a full
    # operating-system installation on that hardware).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: i686-unknown-linux-musl, qemu: i386 }
          - { target: armv7-unknown-linux-musleabihf, qemu: arm }
          - { target: riscv64gc-unknown-linux-musl, qemu: riscv64 }
    env:
      CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C link-self-contained=yes"
      SIMPLE_SETUP_NO_LOG: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: cargo build --release -p simple-setup-cli --target ${{ matrix.target }}
      - name: The restore program runs and names its processor
        run: |
          qemu-${{ matrix.qemu }}-static target/${{ matrix.target }}/release/simple-setup --version
          qemu-${{ matrix.qemu }}-static target/${{ matrix.target }}/release/simple-setup system
      - name: Core unit tests under emulation
        run: |
          bin=$(cargo test -p simple-setup-core --lib --target ${{ matrix.target }} --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .target.kind == ["lib"]) | .executable' | tail -1)
          qemu-${{ matrix.qemu }}-static "$bin" --test-threads 4
